services:
  mongodb:
    image: mongo:7
    container_name: fieldverify-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - fieldverify_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fieldverify-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - fieldverify_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fieldverify_mongo_data:
  fieldverify_redis_data:
